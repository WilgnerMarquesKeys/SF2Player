name: Build SF2Player (macOS)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar SF2Player.app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Versões das ferramentas
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Compilar e empacotar o .app (Universal x86_64 + arm64, macOS 10.15+)
        run: bash scripts/build_app.sh

      - name: Compactar o .app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SF2Player.app SF2Player-macOS.zip
          ls -lh SF2Player-macOS.zip

      - name: Enviar como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF2Player-macOS
          path: build/SF2Player-macOS.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publicar na aba Releases (somente tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SF2Player-macOS.zip
          generate_release_notes: true
